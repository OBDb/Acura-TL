references:
  - "https://en.wikipedia.org/wiki/Acura_TL"

generations:
  - name: "First Generation"
    start_year: 1996
    end_year: 1998
    description: "The first generation TL replaced the Acura Vigor as the brand's mid-size luxury sedan. Available with either a 2.5L inline-five cylinder or 3.2L V6 engine, it offered a comfortable ride, premium features, and Acura's reputation for reliability in a conservatively styled package. Production began in 1995 for the 1996 model year, with assembly at Sayama Plant in Japan."

  - name: "Second Generation"
    start_year: 1999
    end_year: 2001
    description: "The second generation TL featured more distinctive styling and came exclusively with a 3.2L V6 engine producing 225 HP. Built in Marysville, Ohio on the Honda Accord platform, this generation established the TL as a sportier alternative to competitors like the Lexus ES, offering a blend of luxury, technology, and performance."

  - name: "Second Generation (2002 Facelift)"
    start_year: 2002
    end_year: 2003
    description: "In March 2001 for the 2002 model year, the TL received a minor facelift with a refreshed front fascia, redesigned taillights, and a 6-disc CD changer. The Type-S variant was added with 260 HP, providing enhanced performance and sportier appeal within the same platform."

  - name: "Third Generation"
    start_year: 2004
    end_year: 2006
    description: "Often considered the most successful TL generation, the third-gen model featured bold styling and class-leading technology. Powered by a 3.2L V6 with 270 HP (later revised to 258 HP due to updated SAE measurement standards), it came with class-leading features including a pioneering DVD-Audio surround sound system. Assembled in Marysville, Ohio, this generation was built on the Honda Accord platform."

  - name: "Third Generation (2007 Facelift)"
    start_year: 2007
    end_year: 2008
    description: "The 2007 Acura TL featured a slightly revised exterior with revised interior including a new steering wheel, redesigned gauges, and footwell lighting. Most notably, the Type-S variant made its return with the 3.5L V6 producing 286 HP, offering enhanced performance and distinctive styling. The base model received suspension changes for improved ride comfort."

  - name: "Fourth Generation"
    start_year: 2009
    end_year: 2011
    description: "The final TL generation premiered for the 2009 model year with controversial styling featuring the prominent 'Power Plenum' upper grille and angular body lines. It featured a 3.5L V6 with 280 HP in the base FWD model, and the all-new SH-AWD variant with a 3.7L V6 producing 305 HP. This was the first TL to offer all-wheel drive capability."

  - name: "Fourth Generation (2012 Facelift)"
    start_year: 2012
    end_year: 2014
    description: "For the 2012 model, Honda updated the front and rear styling, replacing the controversial 'beak' insert in the front grille with a smaller insert that flows better with the headlights. The 6-speed automatic transmission replaced the 5-speed, improving performance and efficiency. Additional features included ventilated seats, blind-spot information system, and upgraded wheels. The TL was eventually replaced by the TLX in 2015."
